# ----------------------------------------
# 1. Server Configuration
# ----------------------------------------
server.port=8081
# ----------------------------------------
# AI API Configuration
# ----------------------------------------
openrouter.api.key=REDACTED_OPENROUTER_KEY
# ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/quality_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------- -----
# 3. Hibernate / JPA Settings
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# 4. Actuator (Live Telemetry)
# ----------------------------------------
management.endpoints.web.exposure.include=health,metrics,info